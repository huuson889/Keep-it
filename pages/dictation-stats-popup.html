<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keepit — Dictation Stats</title>
<link rel="stylesheet" href="../css/dashboard/dictation-stats-popup.css">
</head>
<body>
<div class="backdrop" id="backdrop">
  <main class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head">
      <div class="head-main">
        <div class="head-icon" aria-hidden="true">📊</div>
        <div class="head-copy">
          <h1 id="modalTitle" data-dstats-i18n="dictationStatsPopupTitle">Phân tích lỗi sai chép chính tả</h1>
        </div>
      </div>
      <div class="head-actions">
        <button class="expand-btn" id="expandBtn" type="button" aria-label="Phóng to popup" title="Phóng to popup" aria-pressed="false" data-dstats-aria="dictationStatsPopupExpand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
        <button class="close-btn" id="closeX" type="button" aria-label="Đóng" title="Đóng" data-dstats-aria="dictationStatsPopupClose">×</button>
      </div>
    </header>

    <div class="modal-body">
      <div class="workspace-topbar">
        <nav class="view-tabs" role="group" aria-label="Chọn chế độ xem" data-dstats-aria="dictationStatsViewTabsLabel">
          <button class="view-tab active" data-view="global" type="button" aria-pressed="true"><span data-dstats-i18n="dictationStatsViewGlobal">🌟 Toàn cục</span></button>
          <button class="view-tab" data-view="critical" type="button" aria-pressed="false"><span data-dstats-i18n="dictationStatsViewCritical">🚨 Cần luyện thêm</span></button>
          <button class="view-tab" data-view="sessions" type="button" aria-pressed="false"><span data-dstats-i18n="dictationStatsViewSessions">📂 Theo web</span></button>
        </nav>
        <div class="toolbar">
          <div class="filter-sets">
            <div class="filters" id="globalFilterPills" role="group" aria-label="Lọc theo nhóm lỗi" data-dstats-aria="dictationStatsFilterLabel">
              <button class="filter active" data-type="all" type="button" aria-pressed="true" data-dstats-i18n="dictationStatsTypeAll">Tất cả nguyên nhân</button>
              <button class="filter" data-type="phonetic" type="button" aria-pressed="false" data-dstats-i18n="dictationStatsTypePhonetic">🎧 Âm vị</button>
              <button class="filter" data-type="rule" type="button" aria-pressed="false" data-dstats-i18n="dictationStatsTypeRule">📜 Quy tắc</button>
              <button class="filter" data-type="typo" type="button" aria-pressed="false" data-dstats-i18n="dictationStatsTypeTypo">⚡ Gõ nhanh</button>
            </div>
            <div class="filters" id="criticalFilterPills" role="group" aria-label="Lọc lỗi cần luyện thêm theo nhóm" data-dstats-aria="dictationStatsFilterLabel" hidden>
              <button class="filter critical-filter active" data-critical-type="all" type="button" aria-pressed="true" data-dstats-i18n="dictationStatsTypeAll">Tất cả nguyên nhân</button>
              <button class="filter critical-filter" data-critical-type="phonetic" type="button" aria-pressed="false" data-dstats-i18n="dictationStatsTypePhonetic">🎧 Âm vị</button>
              <button class="filter critical-filter" data-critical-type="rule" type="button" aria-pressed="false" data-dstats-i18n="dictationStatsTypeRule">📜 Quy tắc</button>
              <button class="filter critical-filter" data-critical-type="typo" type="button" aria-pressed="false" data-dstats-i18n="dictationStatsTypeTypo">⚡ Gõ nhanh</button>
            </div>
          </div>
          <div class="toolbar-end">
            <span class="critical-threshold" id="criticalThreshold" data-dstats-i18n="dictationStatsCriticalThreshold" hidden>≥ 70% lỗi</span>
            <select class="sort" id="sortSelect" aria-label="Sắp xếp lỗi" data-dstats-aria="dictationStatsSortLabel">
              <option value="rate" data-dstats-i18n="dictationStatsSortRate">Tỷ lệ lỗi cao nhất</option>
              <option value="errors" data-dstats-i18n="dictationStatsSortErrors">Sai nhiều nhất</option>
              <option value="recent" data-dstats-i18n="dictationStatsSortRecent">Mới nhất</option>
            </select>
            <select class="sort" id="criticalSortSelect" aria-label="Sắp xếp lỗi cần luyện thêm" data-dstats-aria="dictationStatsSortLabel" hidden>
              <option value="rate" data-dstats-i18n="dictationStatsSortRate">Tỷ lệ lỗi cao nhất</option>
              <option value="errors" data-dstats-i18n="dictationStatsSortErrors">Sai nhiều nhất</option>
              <option value="recent" data-dstats-i18n="dictationStatsSortRecent">Mới nhất</option>
            </select>
            <label class="search-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
              <input id="searchInput" type="search" placeholder="Tìm trong các lỗi đã lưu…" autocomplete="off" data-dstats-aria="dictationStatsSearchLabel">
            </label>
          </div>
        </div>
      </div>

      <div class="dashboard-grid">
        <aside class="stats-sidebar" aria-label="Thống kê theo lựa chọn hiện tại">
          <section class="metrics" aria-label="Tổng quan thống kê">
            <article class="metric"><span class="metric-icon" aria-hidden="true">📖</span><div class="metric-copy"><div class="metric-top" data-dstats-i18n="dictationStatsMetricWords">Từ sai</div><div class="metric-value"><span class="v-primary" id="statsWordCount">0</span><span class="unit" data-dstats-i18n="dictationStatsUnitWords">từ</span></div></div></article>
            <article class="metric"><span class="metric-icon" aria-hidden="true">⚠️</span><div class="metric-copy"><div class="metric-top" data-dstats-i18n="dictationStatsMetricErrors">Gõ nhầm</div><div class="metric-value"><span class="v-amber" id="statsErrorCount">0</span><span class="unit" data-dstats-i18n="dictationStatsUnitErrors">lượt</span></div></div></article>
            <article class="metric"><span class="metric-icon" aria-hidden="true">🎉</span><div class="metric-copy"><div class="metric-top" data-dstats-i18n="dictationStatsMetricFixes">Sửa đúng</div><div class="metric-value"><span class="v-green" id="statsFixCount">0</span><span class="unit" data-dstats-i18n="dictationStatsUnitFixes">lần</span></div></div></article>
            <article class="metric"><span class="metric-icon" aria-hidden="true">📈</span><div class="metric-copy"><div class="metric-top" data-dstats-i18n="dictationStatsMetricRecovery">Khắc phục</div><div class="metric-value"><span class="v-pink" id="statsRecoveryRate">0%</span><span class="unit" data-dstats-i18n="dictationStatsUnitRecovery">hiệu suất</span></div></div></article>
          </section>
        </aside>
        <section class="results-panel" aria-label="Danh sách lỗi chính tả">
          <div class="results-scroll" id="resultsScroll">
            <section class="view-pane" data-pane="global"><div class="smart-list" id="globalList" aria-live="polite"></div></section>
            <section class="view-pane" data-pane="critical" aria-label="Các lỗi cần luyện thêm" hidden><div class="smart-list" id="criticalList" aria-live="polite"></div></section>
            <section class="view-pane" data-pane="sessions" aria-label="Các nguồn web đã luyện" hidden><div class="smart-list" id="sessionList"></div></section>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<button class="reopen" id="reopen" type="button" data-dstats-i18n="dictationStatsPopupReopen">Mở lại Phân tích 📊</button>
<script src="../js/shared/site-icons.js"></script>
<script src="../js/dashboard/dictation-stats-popup.js"></script>
</body>
</html>
