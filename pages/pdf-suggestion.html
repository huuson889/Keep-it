<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open PDF with Keepit</title>
  <link rel="stylesheet" href="../css/popup/pdf-suggestion.css">
</head>
<body>
  <main class="hint" role="dialog" aria-labelledby="hintTitle" aria-describedby="hintHelp">
    <div class="file-icon" aria-hidden="true">PDF</div>
    <div class="copy">
      <p class="eyebrow" data-i18n="pdfFloatingKicker">KEEPIT DOCUMENTS</p>
      <h1 id="hintTitle" data-i18n="pdfFloatingTitle">Open this PDF in Keepit?</h1>
      <p id="hintHelp" data-i18n="pdfFloatingHelp">Choose the PDF from your device in Keepit Documents. It stays on this device.</p>
    </div>
    <button id="closeHint" class="close" type="button" data-i18n-title="close" data-i18n-aria-label="close" aria-label="Close">×</button>
    <button id="openDocuments" class="primary" type="button" data-i18n="pdfFloatingAction">Open Keepit Documents</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="timeout-track" aria-hidden="true"><i></i></div>
  </main>
  <script src="../js/core/browser-polyfill.js"></script>
  <script src="../js/core/languages.js"></script>
  <script src="../js/popup/pdf-suggestion.js"></script>
</body>
</html>
