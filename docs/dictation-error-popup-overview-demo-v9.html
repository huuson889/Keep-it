.type-tag.rule{border-color:#fde68a;background:var(--amber-soft);color:#d97706;text-transform:none}.type-tag.phonetic{border-color:#bae6fd;background:var(--blue-soft);color:var(--blue)}.type-tag.typo{border-color:#fecdd3;background:var(--pink-soft);color:var(--pink)}
.context-label,.variants-label{color:#64748b;font-size:11px;font-weight:1000;letter-spacing:.04em;text-transform:uppercase}

.video-title:hover{text-decoration:underline}
.video-toggle{font-size:12px;width:30px;height:30px;display:grid;place-items:center;flex:none;border:1px solid #e2e8f0;border-radius:9px;background:#fff;color:#64748b;transition:transform .25s ease,background .15s}

.video-body-inner{min-height:0;overflow:hidden;display:grid;gap:9px;padding:10px 12px;transition:padding-block .28s ease}
.video-body.collapsed{grid-template-rows:0fr;opacity:0;border-top-color:transparent;pointer-events:none}
.video-body.collapsed .video-body-inner{padding-block:0}
.video-body-inner .smart-card{box-shadow:0 4px 12px rgba(68,61,133,.08);border-radius:13px;padding:11px 13px}
.empty{padding:32px 20px;border:1px dashed #e2e8f0;border-radius:16px;background:#f8fafc;color:#64748b;text-align:center;font-size:13.5px}
.footer{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex:none;padding:12px 24px;border-top:1px solid var(--line);background:#fff}
.done-btn{padding:8px 18px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:12px;font-weight:1000;box-shadow:0 5px 12px #7161df3a;transition:background .15s,transform .15s}
.done-btn:hover{transform:translateY(-1px);background:var(--brand-dark)}

.modal{width:min(1480px,calc(100vw - 32px))}

<body>
<div class="backdrop">
  <main class="modal" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <header class="modal-head">
      <div class="head-main">
        <div class="head-icon" aria-hidden="true">📊</div>
        <div class="head-copy">
          <h1 id="popupTitle">Phân tích lỗi sai chép chính tả</h1>
          <p class="subtitle">Nhìn lại lỗi thường gặp, ngữ cảnh và tiến độ sửa đúng theo video.</p>
        </div>
      </div>
      <div class="head-actions">
        <button class="expand-btn" id="expandBtn" type="button" aria-label="Phóng to popup" title="Phóng to popup" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
        <button class="close-btn" id="closeBtn" type="button" aria-label="Đóng demo" title="Đóng demo">×</button>
      </div>
    </header>

    <div class="modal-body">
      <div class="workspace-topbar">
        <nav class="view-tabs" aria-label="Chọn chế độ xem">
          <button class="view-tab active" type="button" data-view="global" aria-pressed="true">🌟 Toàn cục</button>
          <button class="view-tab" type="button" data-view="critical" aria-pressed="false">🚨 Cần luyện thêm</button>
          <button class="view-tab" type="button" data-view="videos" aria-pressed="false">📂 Theo web</button>
        </nav>
        <div class="toolbar">
          <div class="filter-sets">
            <div class="filters" id="globalFilters" role="group" aria-label="Lọc theo nhóm lỗi">
              <button class="filter active" data-filter="all" type="button" aria-pressed="true">Tất cả nguyên nhân</button>
              <button class="filter" data-filter="phonetic" type="button" aria-pressed="false">🎧 Âm vị</button>
              <button class="filter" data-filter="rule" type="button" aria-pressed="false">📜 Quy tắc</button>
              <button class="filter" data-filter="typo" type="button" aria-pressed="false">⚡ Gõ nhanh</button>
            </div>
            <div class="filters" id="criticalFilters" role="group" aria-label="Lọc lỗi cần luyện thêm theo nhóm" hidden>
              <button class="filter critical-filter active" data-critical-filter="all" type="button" aria-pressed="true">Tất cả nguyên nhân</button>
              <button class="filter critical-filter" data-critical-filter="phonetic" type="button" aria-pressed="false">🎧 Âm vị</button>
              <button class="filter critical-filter" data-critical-filter="rule" type="button" aria-pressed="false">📜 Quy tắc</button>
              <button class="filter critical-filter" data-critical-filter="typo" type="button" aria-pressed="false">⚡ Gõ nhanh</button>
            </div>
          </div>
          <div class="toolbar-end">
            <span class="critical-threshold" id="criticalThreshold" hidden>≥ 70% lỗi</span>
            <select class="sort" id="sortSelect" aria-label="Sắp xếp lỗi"><option value="rate">Tỷ lệ lỗi cao nhất</option><option value="errors">Sai nhiều nhất</option><option value="recent">Mới nhất</option></select>
            <select class="sort" id="criticalSortSelect" aria-label="Sắp xếp lỗi cần luyện thêm" hidden><option value="rate">Tỷ lệ lỗi cao nhất</option><option value="errors">Sai nhiều nhất</option><option value="recent">Mới nhất</option></select>
            <label class="search-box" aria-label="Tìm lỗi chính tả">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
              <input id="searchInput" type="search" placeholder="Tìm trong các lỗi đã lưu…" autocomplete="off">
            </label>
          </div>
        </div>
      </div>

      <div class="dashboard-grid">
        <aside class="stats-sidebar" aria-label="Thống kê theo lựa chọn hiện tại">
          <section class="metrics" aria-label="Tổng quan thống kê demo">
            <article class="metric"><span class="metric-icon" aria-hidden="true">📖</span><div class="metric-copy"><div class="metric-top">Từ sai</div><div class="metric-value"><span class="v-primary" id="metricWords">0</span><span class="unit">từ</span></div></div></article>
            <article class="metric"><span class="metric-icon" aria-hidden="true">⚠️</span><div class="metric-copy"><div class="metric-top">Lượt gõ nhầm</div><div class="metric-value"><span class="v-amber" id="metricErrors">0</span><span class="unit">lượt</span></div></div></article>
            <article class="metric"><span class="metric-icon" aria-hidden="true">🎉</span><div class="metric-copy"><div class="metric-top">Đã sửa đúng</div><div class="metric-value"><span class="v-green" id="metricFixes">0</span><span class="unit">lần</span></div></div></article>
            <article class="metric"><span class="metric-icon" aria-hidden="true">📈</span><div class="metric-copy"><div class="metric-top">Khắc phục</div><div class="metric-value"><span class="v-pink" id="metricRate">0%</span><span class="unit">hiệu suất</span></div></div></article>
          </section>
        </aside>
        <section class="results-panel" aria-label="Danh sách lỗi chính tả">
          <div class="results-scroll" id="resultsScroll">
            <section class="view-pane" data-pane="global"><div class="smart-list" id="globalList" aria-live="polite"></div></section>
            <section class="view-pane" data-pane="critical" aria-label="Các lỗi cần luyện thêm" hidden><div class="smart-list" id="criticalList" aria-live="polite"></div></section>
            <section class="view-pane" data-pane="videos" hidden><div class="smart-list video-list" id="videoList"></div></section>
          </div>
        </section>
      </div>
    </div>
    <footer class="footer">
      <button class="done-btn" type="button">Xong rồi ✨</button>
    </footer>
  </main>
</div>
<script>
(() => {
  const modal=document.querySelector(".modal"),expandBtn=document.getElementById("expandBtn"),closeBtn=document.getElementById("closeBtn");
  const expandIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
  const shrinkIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v4a2 2 0 0 1-2 2H3M21 9h-4a2 2 0 0 1-2-2V3M15 21v-4a2 2 0 0 1 2-2h4M3 15h4a2 2 0 0 1 2 2v4"/></svg>';
  expandBtn.addEventListener("click",()=>{const expanded=modal.classList.toggle("is-expanded");expandBtn.setAttribute("aria-pressed",String(expanded));expandBtn.setAttribute("aria-label",expanded?"Thu nhỏ popup":"Phóng to popup");expandBtn.title=expandBtn.getAttribute("aria-label");expandBtn.innerHTML=expanded?shrinkIcon:expandIcon;});
  closeBtn.addEventListener("click",()=>document.querySelector(".backdrop").hidden=true);
  document.querySelector(".done-btn").addEventListener("click",()=>document.querySelector(".backdrop").hidden=true);
  const videos = [
    { title:"Be Kind to Yourself — You Are Enough | English Motivation", url:"https://www.youtube.com/", search:"Be Kind to Yourself English Motivation", words:["learn","welcome","conversation","yourself"] },
    { title:"BBC Learning English — Everyday English", url:"https://www.bbc.co.uk/learningenglish", href:"https://www.bbc.co.uk/learningenglish", search:"Everyday English Listening Practice Daily Conversations", words:["receive","environment","occasionally","comfortable"] },
  ];
  const demoItems = [
    {word:"learn",type:"rule",typeLabel:"📜 Lỗi quy tắc chính tả",before:"Hello everyone and welcome back to Enjoy English Talks, where every conversation helps you ",typed:"d",after:".",errors:6,fixes:1,rate:86,lastAt:8,video:0,variants:[["d",2],["ads",1],["asdca",1],["asdd",1],["tim",1]]},
    {word:"welcome",type:"typo",typeLabel:"⚡ Lỗi gõ nhanh (Typo)",before:"Hello everyone and ",typed:"elcome",after:" back to Enjoy English Talks, where every conversation helps you learn.",errors:2,fixes:1,rate:67,lastAt:7,video:0,variants:[["elcome",2]]},
    {word:"conversation",type:"typo",typeLabel:"⚡ Lỗi gõ nhanh (Typo)",before:"Hello everyone and welcome back to Enjoy English Talks, where every ",typed:"onversation",after:" helps you learn.",errors:1,fixes:1,rate:50,lastAt:6,video:0,variants:[["onversation",1]]},
    {word:"receive",type:"rule",typeLabel:"📜 Lỗi quy tắc chính tả",before:"Please ",typed:"recieve",after:" the document before Friday.",errors:5,fixes:1,rate:83,lastAt:5,video:1,variants:[["recieve",3],["recive",1],["receve",1]]},
    {word:"environment",type:"phonetic",typeLabel:"🎧 Âm vị / nghe nhầm",before:"We should protect our natural ",typed:"enviroment",after:" together.",errors:3,fixes:0,rate:100,lastAt:4,video:1,variants:[["enviroment",2],["enviromment",1]]},
    {word:"occasionally",type:"typo",typeLabel:"⚡ Lỗi gõ nhanh (Typo)",before:"I ",typed:"occasionaly",after:" listen to podcasts in English.",errors:2,fixes:1,rate:67,lastAt:3,video:1,variants:[["occasionaly",2]]},
    {word:"comfortable",type:"phonetic",typeLabel:"🎧 Âm vị / nghe nhầm",before:"Make sure you feel ",typed:"comfterble",after:" while speaking.",errors:2,fixes:0,rate:100,lastAt:2,video:1,variants:[["comfterble",1],["comfortible",1]]},
    {word:"beautiful",type:"rule",typeLabel:"📜 Lỗi quy tắc chính tả",before:"It was a ",typed:"beautifull",after:" day for a walk.",errors:1,fixes:0,rate:100,lastAt:1,video:1,variants:[["beautifull",1]]},
  ];
  const globalList=document.getElementById("globalList"),criticalList=document.getElementById("criticalList"),videoList=document.getElementById("videoList");
  const searchInput=document.getElementById("searchInput"),resultsScroll=document.getElementById("resultsScroll");
  const globalFilters=document.getElementById("globalFilters"),criticalFilters=document.getElementById("criticalFilters");
  let activeFilter="all",activeCriticalFilter="all",activeView="global";
  const sourceHref=video=>videos[video].href||`https://www.youtube.com/results?search_query=${encodeURIComponent(videos[video].search)}`;
  function textNode(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;node.textContent=text;return node;}
  function makeSmartCardLabels(){
    const row=textNode("div","smart-card-labels","");
    ["Từ sai","Ngữ cảnh","Biến thể gõ","Loại lỗi","Tổng quan lỗi"].forEach(label=>row.append(textNode("div","context-label",label)));
    return row;
  }
  function makeCard(item, videoTitle, videoIndex){
    const card=textNode("article","smart-card");card.dataset.type=item.type;card.dataset.errors=String(item.errors);card.dataset.recent=String(item.lastAt);
    const wordBox=textNode("div","word-box");
    const wordTitle=textNode("div","word-title","");wordTitle.append(textNode("span","word-label",item.word));
    const audio=textNode("button","audio-btn","");audio.type="button";audio.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';audio.setAttribute("aria-label",`Phát âm ${item.word}`);audio.title=audio.getAttribute("aria-label");
    audio.addEventListener("click",()=>{if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;const utterance=new SpeechSynthesisUtterance(item.word);utterance.lang="en-US";window.speechSynthesis.cancel();window.speechSynthesis.speak(utterance);});
    wordTitle.append(audio);wordBox.append(wordTitle);
    const errorTypeBox=textNode("div","error-type-box");errorTypeBox.append(textNode("span",`type-tag ${item.type}`,item.typeLabel));
    const contextBox=textNode("div","context-box");
    const sentence=textNode("div","context-sentence","");sentence.append(document.createTextNode(`“${item.before}`));sentence.append(textNode("span","wrong-token",item.typed));sentence.append(document.createTextNode(`${item.after}”`));contextBox.append(sentence);
    const link=document.createElement("a");link.className="source-link";link.href=sourceHref(videoIndex);link.target="_blank";link.rel="noopener noreferrer";const host=new URL(videos[videoIndex].url).hostname;link.append(textNode("span","source-icon",/(^|\.)youtube\.com$|(^|\.)youtu\.be$/i.test(host)?"📺":"🌐"),document.createTextNode(videoTitle));link.title=`Mở nguồn: ${videoTitle}`;contextBox.append(link);
    const variantsBox=textNode("div","variants-box");const variants=textNode("div","variant-list");
    item.variants.forEach(([label,count])=>variants.append(textNode("span","variant",`${label} ×${count}`)));variantsBox.append(variants);
    const summary=textNode("div","error-summary","");summary.append(textNode("strong","",`Sai ${item.errors} lần`),textNode("span","error-fix",`Sửa đúng ${item.fixes}`),textNode("span","error-rate",`Tỷ lệ ${item.rate}%`));
    card.append(wordBox,contextBox,variantsBox,errorTypeBox,summary);return card;
  }
  function itemSource(item){return videos[item.video];}
  function matchesSearch(item){
    const query=searchInput.value.trim().toLocaleLowerCase("vi");
    if(!query)return true;
    const video=itemSource(item);
    const haystack=[item.word,item.typeLabel,item.before,item.typed,item.after,video.title,video.url,...item.variants.flatMap(([label])=>[label])].join(" ").toLocaleLowerCase("vi");
    return haystack.includes(query);
  }
  function currentItems(){
    let items=demoItems.filter(matchesSearch);
    if(activeView==="critical")return items.filter(item=>item.errors>=3&&item.rate>=70&&(activeCriticalFilter==="all"||item.type===activeCriticalFilter));
    return items.filter(item=>activeFilter==="all"||item.type===activeFilter);
  }
  function updateMetrics(){
    const items=currentItems();
    const words=new Set(items.map(item=>item.word.toLocaleLowerCase("en"))).size;
    const errors=items.reduce((sum,item)=>sum+item.errors,0),fixes=items.reduce((sum,item)=>sum+item.fixes,0);
    const rate=errors+fixes?Math.round(fixes/(errors+fixes)*100):0;
    document.getElementById("metricWords").textContent=String(words);
    document.getElementById("metricErrors").textContent=String(errors);
    document.getElementById("metricFixes").textContent=String(fixes);
    document.getElementById("metricRate").textContent=`${rate}%`;
  }
  function replaceCards(list,items){
    const nodes=[makeSmartCardLabels(),...items.map(item=>makeCard(item,itemSource(item).title,item.video))];
    if(!items.length)nodes.push(textNode("div","empty","Không tìm thấy lỗi phù hợp với lựa chọn này."));
    list.replaceChildren(...nodes);
  }
  function drawGlobal(){
    const order=document.getElementById("sortSelect").value;
    const filtered=demoItems.filter(item=>matchesSearch(item)&&(activeFilter==="all"||item.type===activeFilter));
    filtered.sort((a,b)=>order==="recent"?b.lastAt-a.lastAt:order==="rate"?b.rate-a.rate:b.errors-a.errors);
    replaceCards(globalList,filtered);updateMetrics();
  }
  function drawCritical(){
    const order=document.getElementById("criticalSortSelect").value;
    const filtered=demoItems.filter(item=>matchesSearch(item)&&item.errors>=3&&item.rate>=70&&(activeCriticalFilter==="all"||item.type===activeCriticalFilter));
    filtered.sort((a,b)=>order==="errors"?b.errors-a.errors:order==="recent"?b.lastAt-a.lastAt:b.rate-a.rate);
    replaceCards(criticalList,filtered);updateMetrics();
  }
  function makeVideoFavicon(video){
    const host=textNode("span","video-favicon","");host.setAttribute("aria-hidden","true");
    const image=document.createElement("img");image.alt="";image.hidden=true;image.referrerPolicy="no-referrer";
    const fallback=textNode("span","video-favicon-fallback","?");
    let pageUrl,origin="",hostname="";
    try{const parsed=new URL(video.url);if(!["http:","https:"].includes(parsed.protocol))throw new Error("unsupported protocol");pageUrl=parsed.href;origin=parsed.origin;hostname=parsed.hostname;}
    catch{host.append(fallback);return host;}
    const isYoutube=/(^|\.)youtube\.com$|(^|\.)youtu\.be$/i.test(hostname);
    fallback.textContent=isYoutube?"▶":hostname.replace(/^www\./i,"").charAt(0).toUpperCase();if(isYoutube)host.classList.add("is-youtube");
    image.addEventListener("load",()=>{image.hidden=false;fallback.hidden=true;});
    image.addEventListener("error",()=>{if(!image.dataset.fallbackUsed){image.dataset.fallbackUsed="1";image.src=`https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(pageUrl)}&sz=32`;}else{image.hidden=true;fallback.hidden=false;}});
    host.append(image,fallback);image.src=`${origin}/favicon.ico`;return host;
  }
  function drawVideos(){
    videoList.replaceChildren();
    const visibleItems=demoItems.filter(item=>matchesSearch(item)&&(activeFilter==="all"||item.type===activeFilter));
    videos.forEach((video,index)=>{
      const groupItems=visibleItems.filter(item=>item.video===index).sort((a,b)=>b.errors-a.errors);
      if(!groupItems.length)return;
      const group=textNode("section","video-group");const head=textNode("div","web-head");
      const titleGroup=textNode("div","web-title-group");titleGroup.append(makeVideoFavicon(video));
      const title=document.createElement("a");title.className="video-title";title.href=sourceHref(index);title.target="_blank";title.rel="noopener noreferrer";title.title=video.title;title.textContent=video.title;titleGroup.append(title);
      const toggle=textNode("button","video-toggle","");toggle.type="button";toggle.setAttribute("aria-expanded","true");toggle.setAttribute("aria-label",`Thu gọn ${video.title}`);const chevron=textNode("span","chevron","▾");toggle.append(chevron);head.append(titleGroup,toggle);
      const body=textNode("div","video-body");const inner=textNode("div","video-body-inner");inner.append(makeSmartCardLabels());
      groupItems.forEach(item=>inner.append(makeCard(item,video.title,index)));
      body.append(inner);group.append(head,body);
      const toggleVideo=()=>{const collapsed=body.classList.toggle("collapsed");toggle.setAttribute("aria-expanded",String(!collapsed));toggle.setAttribute("aria-label",`${collapsed?"Mở rộng":"Thu gọn"} ${video.title}`);body.setAttribute("aria-hidden",String(collapsed));body.inert=collapsed;toggle.querySelector(".chevron").textContent=collapsed?"▸":"▾";};
      toggle.addEventListener("click",event=>{event.stopPropagation();toggleVideo();});
      head.addEventListener("click",event=>{if(event.target.closest(".video-title"))return;toggleVideo();});
      videoList.append(group);
    });
    if(!visibleItems.length)videoList.append(textNode("div","empty","Không tìm thấy lỗi phù hợp với lựa chọn này."));
    updateMetrics();
  }
  function syncToolbar(){
    const critical=activeView==="critical",videosView=activeView==="videos";
    globalFilters.hidden=critical;criticalFilters.hidden=!critical;
    document.getElementById("sortSelect").hidden=critical||videosView;
    document.getElementById("criticalSortSelect").hidden=!critical;
    document.getElementById("criticalThreshold").hidden=!critical;
  }
  function setView(view){
    activeView=view;
    document.querySelectorAll(".view-tab").forEach(tab=>{const on=tab.dataset.view===view;tab.classList.toggle("active",on);tab.setAttribute("aria-pressed",String(on));});
    document.querySelectorAll(".view-pane").forEach(pane=>pane.hidden=pane.dataset.pane!==view);
    syncToolbar();updateMetrics();resultsScroll.scrollTop=0;
  }
  function refreshAll(){drawGlobal();drawCritical();drawVideos();updateMetrics();}
  document.querySelectorAll(".view-tab").forEach(tab=>tab.addEventListener("click",()=>{setView(tab.dataset.view);}));
  globalFilters.querySelectorAll(".filter").forEach(button=>button.addEventListener("click",()=>{activeFilter=button.dataset.filter;globalFilters.querySelectorAll(".filter").forEach(filter=>{const on=filter===button;filter.classList.toggle("active",on);filter.setAttribute("aria-pressed",String(on));});refreshAll();}));
  criticalFilters.querySelectorAll(".critical-filter").forEach(button=>button.addEventListener("click",()=>{activeCriticalFilter=button.dataset.criticalFilter;criticalFilters.querySelectorAll(".critical-filter").forEach(filter=>{const on=filter===button;filter.classList.toggle("active",on);filter.setAttribute("aria-pressed",String(on));});drawCritical();}));
  document.getElementById("sortSelect").addEventListener("change",drawGlobal);
  document.getElementById("criticalSortSelect").addEventListener("change",drawCritical);
  searchInput.addEventListener("input",refreshAll);
  drawGlobal();drawCritical();drawVideos();syncToolbar();
})();
</script>
</body>
</html>
