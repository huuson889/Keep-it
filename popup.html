<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keepit - Highlight Notes</title>
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="icons/icon.svg" width="32" height="32" alt="">
    <div class="brand-copy"><h1 data-i18n="appName">Keepit - Highlight Notes</h1><p data-i18n="popupTagline">Keep learning everything</p></div>
  </div>
  <div class="header-status">
    <span class="menu-item item-free"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3zm0 2.18l6 2.25v4.57c0 4.54-3.2 8.91-6 10.08-2.8-1.17-6-5.54-6-10.08V6.43l6-2.25z" fill="currentColor"/></svg><span data-i18n="freePlan">Free</span></span>
    <button id="openDashboardSettings" class="theme-toggle" type="button" data-i18n-title="settings" data-i18n-aria-label="settings" aria-label="Settings" title="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings preview-icon" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.804a6.5 6.5 0 0 0 8.268 8.268c.344-.215.826-.003.803.4Z"/></svg>
    </button>
  </div>
</header>
<main class="popup-main">
  <div class="primary-actions">
    <div class="action-grid">
      <button id="dashboard" class="action-button dashboard-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span data-i18n="openDashboard">Dashboard</span></button>
      <button id="openSidebar" class="action-button sidebar-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg><span data-i18n="openSidebarButton">Toggle Sidebar</span></button>
    </div>
    <button id="restore" class="restore-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg><span data-i18n="restorePage">Restore highlights</span></button>
  </div>
  <section class="settings-card">
    <div class="section-heading"><h2 data-i18n="generalSettings">General settings</h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M2 14h4m4-6h4m4 8h4"/></svg></div>
    <div class="language-row"><label for="languageSearch" data-i18n="language">Language</label><div class="language-wrap"><input id="languageSearch" role="combobox" aria-expanded="false" aria-controls="languageOptions" autocomplete="off" data-i18n-placeholder="languagePlaceholder" placeholder="Search language…"><svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><div id="languageOptions" class="language-options" role="listbox"></div></div></div>
    <hr>
    <div class="toggle-list">
      <label class="toggle-row"><span data-i18n="autoPopup">Auto-open popup</span><span class="switch"><input id="showOnSelect" type="checkbox"><i></i></span></label>
      <label class="toggle-row"><span data-i18n="autoHighlight">Auto highlight</span><span class="switch"><input id="autoHighlight" type="checkbox"><i></i></span></label>
      <label class="toggle-row"><span data-i18n="autoSentenceNote">Auto sentence note</span><span class="switch"><input id="sentenceNoteEnabled" type="checkbox"><i></i></span></label>
      <label class="toggle-row"><span data-i18n="autoTranslateOnPopup">Auto-translate when pop-up</span><span class="switch"><input id="autoTranslate" type="checkbox"><i></i></span></label>
      <hr class="toggle-divider">
      <label class="toggle-row"><span data-i18n="showKeepitIcon">Show Keepit translate icon</span><span class="switch"><input id="translateIconEnabled" type="checkbox"><i></i></span></label>
      <label class="toggle-row"><span data-i18n="showDirectTranslationPopup">Show direct translation popup</span><span class="switch"><input id="translationPopupEnabled" type="checkbox"><i></i></span></label>
      <hr class="toggle-divider">
      <label class="toggle-row"><span data-i18n="autoSpeakSelectedText">Auto-speak when popup</span><span class="switch"><input id="autoSpeakSelectedText" type="checkbox"><i></i></span></label>
      <label id="websiteDisableRow" class="toggle-row"><span data-i18n="enableWebsite">Enable on this website</span><span class="switch"><input id="disableWebsite" type="checkbox"><i></i></span></label>
    </div>
  </section>
  <section class="settings-card color-card">
    <div class="section-heading"><h2 data-i18n="defaultHighlightColorLabel">Default highlight color</h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.3a1.7 1.7 0 0 0 1.2-2.9 1.7 1.7 0 0 1 1.2-2.9H18a3 3 0 0 0 3-3c0-5.1-4-9.2-9-9.2Z"/><path d="M7.5 10h.01M11 7h.01M15 8h.01"/></svg></div>
    <div id="defaultHighlightColors" class="default-colors" role="group" aria-label="Default highlight color">
      <button type="button" class="default-color color-yellow" data-color="yellow" data-i18n-title="colorYellow" data-i18n-aria-label="colorYellow" aria-label="Yellow" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
      <button type="button" class="default-color color-green" data-color="green" data-i18n-title="colorGreen" data-i18n-aria-label="colorGreen" aria-label="Green" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
      <button type="button" class="default-color color-purple" data-color="purple" data-i18n-title="colorPurple" data-i18n-aria-label="colorPurple" aria-label="Purple" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
      <button type="button" class="default-color color-red" data-color="red" data-i18n-title="colorRed" data-i18n-aria-label="colorRed" aria-label="Red" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
      <button type="button" class="default-color color-blue" data-color="blue" data-i18n-title="colorBlue" data-i18n-aria-label="colorBlue" aria-label="Blue" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
      <button type="button" class="default-color color-orange" data-color="orange" data-i18n-title="colorOrange" data-i18n-aria-label="colorOrange" aria-label="Orange" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
    </div>
  </section>
  <section class="settings-card shortcut-card">
    <div class="section-heading"><h2 data-i18n="keyboardShortcuts">Keyboard shortcuts</h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M7 12h.01M11 12h.01M15 12h.01M6 15h12"/></svg></div>
    <div class="shortcut-row"><span data-i18n="openNotePopup">Open note popup</span><input id="shortcut" class="shortcut" readonly value="Alt+S" title="Click and press a shortcut"></div>
    <div class="shortcut-row"><span data-i18n="togglePageSidebar">Toggle page sidebar</span><input id="sidebarShortcut" class="shortcut" readonly value="Alt+Q" title="Click and press a shortcut"></div>
    <div class="shortcut-row"><span data-i18n="translateSelectedText">Translate selected text</span><input id="translateSelectedShortcut" class="shortcut" readonly value="Alt+W" title="Click and press a shortcut"></div>
    <div class="shortcut-row"><span data-i18n="toggleWebsiteShortcutLabel">Toggle Enable on this website</span><input id="toggleWebsiteShortcut" class="shortcut" readonly value="Alt+D" title="Click and press a shortcut"></div>
  </section>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</main>
<footer class="popup-footer"><span id="extensionStatus" class="extension-status"><i aria-hidden="true"></i><span data-i18n="extensionActive">Active</span></span><span id="versionLabel" class="popup-version"></span></footer>
<script src="browser-polyfill.js"></script><script src="error-logger.js"></script><script src="config.js"></script><script src="i18n.js"></script><script src="popup.js"></script>
</body>
</html>
